<style>
:root{
  --bg:#13102A; --bg2:#1C1740; --surface:#231C4D; --surface2:#2C2460;
  --fg:#F3F0FF; --muted:#A89FD6; --line:#3A3178;
  --accent:#FFC94A; --accent-ink:#2A1B00;
  --ok:#3FD08A; --bad:#FF6262;
  --a1:#E84855; --a2:#2C7BE5; --a3:#F2B705; --a4:#3FD08A;
  --radius:18px;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:radial-gradient(1200px 800px at 50% -10%, var(--bg2), var(--bg) 60%);
  color:var(--fg);
  font-family:'IBM Plex Sans', system-ui, sans-serif;
  padding-inline:16px;
  padding-block:18px;
  padding-top:calc(18px + env(safe-area-inset-top, 0px));
  padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px));
}
h1,h2,h3{font-family:'Fraunces', Georgia, serif; text-wrap:balance; margin:0;}
.mono{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums;}
.wrap{max-width:720px; margin-inline:auto; display:flex; flex-direction:column; gap:18px; min-height:calc(100vh - 36px);}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.brand{display:flex; align-items:baseline; gap:8px;}
.brand .mark{font-family:'Fraunces',serif; font-weight:900; font-size:22px; letter-spacing:-.02em;}
.brand .mark em{font-style:normal; color:var(--accent);}
.phase-pill{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); border:1px solid var(--line); padding:5px 10px; border-radius:999px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px; min-width:0;}
.stage{flex:1; display:flex; flex-direction:column; gap:18px; justify-content:center;}

.btn{
  font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:15px;
  border-radius:12px; border:1px solid var(--line); background:var(--surface2); color:var(--fg);
  padding:13px 18px; cursor:pointer; transition:transform .08s ease, border-color .15s ease;
}
.btn:hover{border-color:var(--accent);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn.ghost{background:transparent;}
.btn.block{width:100%; text-align:center;}
.btn.big{font-size:18px; padding:16px 22px;}

input[type=text]{
  font-family:'IBM Plex Mono', monospace; font-size:16px; width:100%;
  background:var(--bg2); border:1px solid var(--line); border-radius:12px; color:var(--fg);
  padding:13px 14px;
}
input[type=text]:focus{outline:2px solid var(--accent); outline-offset:1px;}
label.field{display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted);}

.row{display:flex; gap:10px; flex-wrap:wrap;}
.col{display:flex; flex-direction:column; gap:10px;}

.chip-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
@media (max-width:460px){ .chip-grid{grid-template-columns:1fr;} }
.chip{
  display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px;
  padding:12px 14px; cursor:pointer; background:var(--surface2); min-width:0;
}
.chip input{accent-color:var(--accent); width:16px; height:16px; flex:none;}
.chip .n{font-size:12px; color:var(--muted);}
.chip.checked{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent);}

.seg{display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden;}
.seg button{flex:1; padding:10px; background:var(--surface2); border:none; color:var(--fg); font-family:inherit; font-weight:600; cursor:pointer; border-right:1px solid var(--line);}
.seg button:last-child{border-right:none;}
.seg button.on{background:var(--accent); color:var(--accent-ink);}

.players{display:flex; flex-wrap:wrap; gap:8px;}
.player-tag{background:var(--surface2); border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-size:14px; display:flex; align-items:center; gap:6px;}
.player-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}

.qtext{font-size:clamp(20px,4vw,28px); font-weight:700; line-height:1.3;}
.timerbar{height:10px; border-radius:999px; background:var(--bg2); border:1px solid var(--line); overflow:hidden;}
.timerbar > div{height:100%; background:var(--accent); transition:width .25s linear;}

.opts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
@media (max-width:480px){ .opts{grid-template-columns:1fr;} }
.opt{
  display:flex; align-items:center; gap:12px; border:none; border-radius:14px; padding:16px;
  color:#fff; font-weight:700; font-size:16px; text-align:left; cursor:pointer; min-width:0;
  box-shadow:0 2px 0 rgba(0,0,0,.25); transition:transform .08s ease, filter .15s ease;
}
.opt:active{transform:scale(.97);}
.opt .shape{width:16px;height:16px; flex:none; background:rgba(255,255,255,.85);}
.opt .label{min-width:0; overflow-wrap:anywhere;}
.opt.o0{background:var(--a1);} .opt.o0 .shape{clip-path:polygon(50% 0,100% 100%,0 100%);}
.opt.o1{background:var(--a2);} .opt.o1 .shape{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
.opt.o2{background:var(--a3);} .opt.o2 .shape{border-radius:50%;}
.opt.o3{background:var(--a4);} .opt.o3 .shape{border-radius:3px;}
.opt:disabled{opacity:.45; cursor:default;}
.opt.correct{outline:3px solid var(--ok); outline-offset:2px;}
.opt.wrong{outline:3px solid var(--bad); outline-offset:2px;}
.opt.picked:not(.correct):not(.wrong){outline:3px solid #fff; outline-offset:2px;}

.muted{color:var(--muted);}
.center{text-align:center;}
.err{color:var(--bad); font-size:14px; min-height:18px;}
.counts{display:flex; flex-direction:column; gap:8px;}
.countrow{display:flex; align-items:center; gap:10px; font-size:14px;}
.countrow .track{flex:1; height:14px; border-radius:7px; background:var(--bg2); border:1px solid var(--line); overflow:hidden;}
.countrow .fill{height:100%; border-radius:7px;}
.countrow .n{width:26px; text-align:right; font-family:'IBM Plex Mono',monospace;}

.lead{display:flex; flex-direction:column; gap:8px;}
.leadrow{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; background:var(--surface2); border:1px solid var(--line);}
.leadrow .rank{font-family:'IBM Plex Mono',monospace; font-weight:700; width:26px; color:var(--muted);}
.leadrow .name{flex:1; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.leadrow .score{font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--accent);}
.leadrow.me{border-color:var(--accent);}
.podium{display:flex; align-items:flex-end; gap:10px; justify-content:center; margin-block:6px;}
.podium .pillar{display:flex; flex-direction:column; align-items:center; gap:6px; width:92px;}
.podium .bar{width:100%; border-radius:10px 10px 0 0; background:var(--surface2); border:1px solid var(--line); display:flex; align-items:flex-start; justify-content:center; padding-top:8px; font-family:'IBM Plex Mono',monospace; font-weight:700;}
.podium .nm{font-size:12px; text-align:center; overflow-wrap:anywhere;}
.podium .p1 .bar{height:110px; background:var(--accent); color:var(--accent-ink);}
.podium .p2 .bar{height:80px;}
.podium .p3 .bar{height:58px;}

.feedback{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; padding-block:20px;}
.feedback .pts{font-family:'Fraunces',serif; font-weight:900; font-size:44px;}
.feedback.ok .pts{color:var(--ok);}
.feedback.no .pts{color:var(--bad);}

.qrbox{background:#ffffff; border-radius:14px; padding:14px; display:inline-flex; align-self:center;}
.qrbox img, .qrbox canvas{display:block; width:160px; height:160px;}
.codetext{font-family:'IBM Plex Mono',monospace; font-size:12px; word-break:break-all; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; text-align:center;}

.hidden{display:none!important;}
footer.note{font-size:12px; color:var(--muted); text-align:center;}
spinner{display:inline-block;}
</style>
</head>

<script>
const CATEGORY_ORDER = Object.keys(QUESTION_BANK);
const TOTAL_AVAILABLE = CATEGORY_ORDER.reduce((n,c)=>n+QUESTION_BANK[c].filter(q=>q.correct!=null).length,0);

// ---------------- storage layer (jsonblob.com, no login needed) ----------------
const BLOB_API = 'https://jsonblob.com/api/jsonBlob';
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function createBlob(data){
  const res = await fetch(BLOB_API, {
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('create_failed');
  let loc = res.headers.get('Location') || res.headers.get('location');
  if(!loc){
    // fallback: some browsers/proxies strip the header; try reading it from the body echo
    throw new Error('no_location');
  }
  return loc.split('/').pop();
}
async function getBlob(id){
  const res = await fetch(`${BLOB_API}/${id}`, {headers:{'Accept':'application/json'}, cache:'no-store'});
  if(res.status===404) return null;
  if(!res.ok) throw new Error('get_failed');
  return res.json();
}
async function putBlob(id, data){
  const res = await fetch(`${BLOB_API}/${id}`, {
    method:'PUT',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('put_failed');
}
// Read-modify-write with verification + retry: jsonblob has no built-in optimistic
// locking, so instead of trusting a single write we re-read after writing and keep
// retrying until the change we wanted is actually visible.
async function mutateBlob(id, mutateFn, verifyFn, tries=6){
  let lastErr = null;
  for(let i=0;i<tries;i++){
    try{
      const current = await getBlob(id) || {};
      const next = mutateFn(JSON.parse(JSON.stringify(current)));
      await putBlob(id, next);
      await sleep(180);
      const after = await getBlob(id);
      if(after && verifyFn(after)) return after;
    }catch(e){ lastErr = e; }
    await sleep(300 + Math.random()*500);
  }
  throw lastErr || new Error('mutate_failed');
}

function myClientId(){
  let id = null;
  try{ id = localStorage.getItem('disquizz_client_id'); }catch(e){}
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : 'c'+Math.random().toString(36).slice(2)+Date.now().toString(36));
    try{ localStorage.setItem('disquizz_client_id', id); }catch(e){}
  }
  return id;
}
const CLIENT_ID = myClientId();

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function baseUrl(){
  return location.origin + location.pathname;
}
function joinUrlFor(gameId){
  return baseUrl() + '#g=' + gameId;
}
function renderJoinQR(containerId, gameId){
  const box = document.getElementById(containerId);
  if(!box) return;
  box.innerHTML = '';
  if(typeof QRCode === 'undefined'){
    box.closest('.qrbox')?.classList.add('hidden');
    return;
  }
  try{
    new QRCode(box, {
      text: joinUrlFor(gameId),
      width: 160, height: 160,
      colorDark: '#13102A', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  }catch(e){
    box.closest('.qrbox')?.classList.add('hidden');
  }
}

// ---------------- app state ----------------
let role = null; // 'host' | 'player'
let gameId = null;
let answersId = null; // id of the answers blob for this game
let gameDoc = null;
let answersDoc = {};
let myScore = 0;
let myName = "";
let answeredThisRound = false;
let myLastAnswer = null;
let countdownTimer = null;
let pollTimer = null;

const app = document.getElementById('app');
function render(html){ app.innerHTML=''; app.appendChild(el(html)); }

function topbar(phase){
  return `<div class="topbar">
    <div class="brand"><span class="mark">Dis<em>quizz</em></span></div>
    ${gameId? `<span class="phase-pill">${phase}</span>`:''}
  </div>`;
}

function saveSession(){
  try{ localStorage.setItem('disquizz_session', JSON.stringify({gameId, answersId, role, name:myName})); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem('disquizz_session'); }catch(e){}
}
function teardown(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; }
  gameDoc=null; answersDoc={}; gameId=null; answersId=null; role=null;
}

function boot(){
  try{
    const saved = JSON.parse(localStorage.getItem('disquizz_session')||'null');
    if(saved && saved.gameId && saved.role){
      gameId=saved.gameId; answersId=saved.answersId; role=saved.role; myName=saved.name||'';
      startPolling();
      return;
    }
  }catch(e){}
  const m = /#g=([a-zA-Z0-9-]+)/.exec(location.hash||'');
  if(m){ showJoin(m[1]); return; }
  showStart();
}

// ================= START =================
function showStart(){
  teardown();
  render(`
    <div class="wrap">
      ${topbar('inicio')}
      <div class="stage">
        <div class="card center col" style="gap:18px;">

          <div class="row" style="justify-content:center; margin-top:6px;">
            <button class="btn primary big" id="btn-host">Crear partida</button>

          </div>
        </div>

  document.getElementById('btn-host').onclick = showHostSetup;
  document.getElementById('btn-join').onclick = ()=>showJoin('');
}

// ================= HOST: SETUP =================
let setupSelected = new Set(CATEGORY_ORDER);
let setupCount = 15;
let setupLimit = 20;

function showHostSetup(){
  render(`
    <div class="wrap">
      ${topbar('crear partida')}
      <div class="stage">
        <div class="card col" style="gap:20px;">
          <h2>Configura tu partida</h2>
          <div class="col">
            <span class="muted" style="font-size:13px;">Categorías</span>
            <div class="chip-grid" id="cats"></div>
          </div>
          <div class="row" style="gap:24px;">
            <div class="col" style="flex:1; min-width:140px;">
              <span class="muted" style="font-size:13px;">Nº de preguntas</span>
              <div class="seg" id="seg-count"></div>
            </div>
            <div class="col" style="flex:1; min-width:140px;">
              <span class="muted" style="font-size:13px;">Tiempo por pregunta</span>
              <div class="seg" id="seg-time"></div>
            </div>
          </div>
          <p class="err" id="setup-err"></p>
          <div class="row">
            <button class="btn ghost" id="back">Volver</button>
            <button class="btn primary block" id="create">Crear sala</button>
          </div>
        </div>
      </div>
    </div>
  `);
  const catsEl = document.getElementById('cats');
  CATEGORY_ORDER.forEach(cat=>{
    const n = QUESTION_BANK[cat].filter(q=>q.correct!=null).length;
    const chip = el(`<label class="chip ${setupSelected.has(cat)?'checked':''}">
      <input type="checkbox" ${setupSelected.has(cat)?'checked':''}>
      <span style="flex:1;min-width:0;">${esc(cat)}</span>
      <span class="n">${n}</span>
    </label>`);
    chip.querySelector('input').onchange = (e)=>{
      if(e.target.checked) setupSelected.add(cat); else setupSelected.delete(cat);
      chip.classList.toggle('checked', e.target.checked);
    };
    catsEl.appendChild(chip);
  });
  const segCount = document.getElementById('seg-count');
  [10,15,20,30].forEach(n=>{
    const b = el(`<button type="button" class="${n===setupCount?'on':''}">${n}</button>`);
    b.onclick = ()=>{ setupCount=n; [...segCount.children].forEach(c=>c.classList.toggle('on', c===b)); };
    segCount.appendChild(b);
  });
  const segTime = document.getElementById('seg-time');
  [10,20,30].forEach(n=>{
    const b = el(`<button type="button" class="${n===setupLimit?'on':''}">${n}s</button>`);
    b.onclick = ()=>{ setupLimit=n; [...segTime.children].forEach(c=>c.classList.toggle('on', c===b)); };
    segTime.appendChild(b);
  });
  document.getElementById('back').onclick = showStart;
  document.getElementById('create').onclick = createGame;
}

async function createGame(){
  const errEl = document.getElementById('setup-err');
  errEl.textContent = '';
  const cats = setupSelected.size? [...setupSelected] : CATEGORY_ORDER;
  let pool = [];
  cats.forEach(c=> pool.push(...QUESTION_BANK[c].filter(q=>q.correct!=null).map(q=>({...q, cat:c}))));
  if(pool.length < 3){ errEl.textContent = 'Elige categorías con más preguntas disponibles.'; return; }
  const n = Math.min(setupCount, pool.length);
  const picked = shuffle(pool).slice(0,n).map(q=>{
    const order = shuffle(q.options.map((o,i)=>i));
    const options = order.map(i=>q.options[i]);
    const correct = order.indexOf(q.correct);
    return { question:q.question, options, correct, cat:q.cat };
  });

  const createBtn = document.getElementById('create');
  createBtn.disabled = true; createBtn.textContent = 'Creando…';
  try{
    const newAnswersId = await createBlob({});
    const newGameId = await createBlob({
      status:'lobby', qIndex:-1, questions:picked, limitMs:setupLimit*1000,
      startedAt:0, createdAt:Date.now(), answersId:newAnswersId, players:{}
    });
    gameId = newGameId; answersId = newAnswersId; role='host';
    saveSession();
    startPolling();
  }catch(e){
    errEl.textContent = 'No se pudo crear la sala (falló el servicio de almacenamiento). Intenta de nuevo en unos segundos.';
    createBtn.disabled=false; createBtn.textContent='Crear sala';
  }
}

// ================= POLLING =================
function startPolling(){
  pollOnce();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollOnce, 1400);
}
async function pollOnce(){
  try{
    const g = await getBlob(gameId);
    if(!g){ gameDoc=null; draw(); return; }
    gameDoc = g;
    if(!answersId) answersId = g.answersId;
    if(answersId && (gameDoc.status==='question' || gameDoc.status==='reveal' || gameDoc.status==='end')){
      answersDoc = await getBlob(answersId) || {};
    }
    if(role==='player' && gameDoc.players && gameDoc.players[CLIENT_ID]){
      myScore = gameDoc.players[CLIENT_ID].score||0;
    }
    draw();
  }catch(e){ /* transient network hiccup: next poll retries */ }
}

function draw(){
  if(!gameDoc){
    render(`<div class="wrap">${topbar('')}<div class="stage"><div class="card center col" style="gap:14px;"><p>Esta partida ya no existe.</p><button class="btn" id="home">Volver al inicio</button></div></div></div>`);
    document.getElementById('home').onclick = ()=>{ clearSession(); showStart(); };
    return;
  }
  if(role==='host'){
    if(gameDoc.status==='lobby') return drawHostLobby();
    if(gameDoc.status==='question') return drawHostQuestion();
    if(gameDoc.status==='reveal') return drawHostReveal();
    if(gameDoc.status==='end') return drawPodium(true);
  }else{
    if(gameDoc.status==='lobby') return drawPlayerWait();
    if(gameDoc.status==='question') return drawPlayerQuestion();
    if(gameDoc.status==='reveal') return drawPlayerReveal();
    if(gameDoc.status==='end') return drawPodium(false);
  }
}

function drawHostLobby(){
  const players = Object.values(gameDoc.players||{});
  render(`
    <div class="wrap">
      ${topbar('sala de espera')}
      <div class="stage">
        <div class="card center col" style="gap:14px;">
          <span class="muted">Escanea para unirte</span>
          <div class="qrbox"><div id="qr"></div></div>
          <span class="muted" style="font-size:12px;">o comparte este enlace</span>
          <div class="codetext">${esc(joinUrlFor(gameId))}</div>

          </div>

async function startGame(){
  const btn = document.getElementById('start');
  if(btn){ btn.disabled=true; btn.textContent='Iniciando…'; }
  try{
    await mutateBlob(gameId,
      g=>({...g, status:'question', qIndex:0, startedAt: Date.now()}),
      g=>g.status==='question' && g.qIndex===0
    );
    pollOnce();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Iniciar partida'; }
  }
}

function drawHostQuestion(){
  const q = gameDoc.questions[gameDoc.qIndex];
  const answeredCount = Object.keys(answersDoc).filter(k=>k.startsWith(gameDoc.qIndex+'_')).length;
  render(`
    <div class="wrap">
      ${topbar(`pregunta ${gameDoc.qIndex+1} / ${gameDoc.questions.length}`)}
      <div class="stage">
        <div class="card col" style="gap:16px;">
          <span class="muted" style="font-size:13px; text-transform:uppercase; letter-spacing:.06em;">${esc(q.cat||'')}</span>
          <div class="qtext">${esc(q.question)}</div>
          <div class="timerbar"><div id="bar" style="width:100%;"></div></div>
          <p class="muted">${answeredCount} jugador(es) respondieron</p>
          <div class="row">
            <button class="btn primary block" id="reveal">Mostrar respuesta</button>
          </div>
        </div>
      </div>
    </div>
  `);
  document.getElementById('reveal').onclick = revealAnswer;
  startHostCountdown();
}

function startHostCountdown(){
  if(countdownTimer) clearInterval(countdownTimer);
  const tick = ()=>{
    const bar = document.getElementById('bar');
    if(!gameDoc || gameDoc.status!=='question'){ clearInterval(countdownTimer); return; }
    const elapsed = Date.now()-gameDoc.startedAt;
    const pct = Math.max(0, 100 - (elapsed/gameDoc.limitMs)*100);
    if(bar) bar.style.width = pct+'%';
    if(elapsed >= gameDoc.limitMs){ clearInterval(countdownTimer); revealAnswer(); }
  };
  tick();
  countdownTimer = setInterval(tick, 300);
}

let revealing = false;
async function revealAnswer(){
  if(revealing) return;
  if(countdownTimer) clearInterval(countdownTimer);
  if(!gameDoc || gameDoc.status!=='question') return;
  revealing = true;
  try{
    await mutateBlob(gameId, g=>({...g, status:'reveal'}), g=>g.status==='reveal');
    await pollOnce();
  }finally{ revealing = false; }
}

function drawHostReveal(){
  const q = gameDoc.questions[gameDoc.qIndex];
  const isLast = gameDoc.qIndex >= gameDoc.questions.length-1;
  const counts = {};
  Object.entries(answersDoc).forEach(([k,a])=>{ if(k.startsWith(gameDoc.qIndex+'_')) counts[a.optionIndex]=(counts[a.optionIndex]||0)+1; });
  const maxCount = Math.max(1, ...q.options.map((_,i)=>counts[i]||0));
  const leaderboard = Object.values(gameDoc.players||{}).sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,5);
  render(`
    <div class="wrap">
      ${topbar(`respuesta ${gameDoc.qIndex+1} / ${gameDoc.questions.length}`)}
      <div class="stage">
        <div class="card col" style="gap:14px;">
          <div class="qtext">${esc(q.question)}</div>
          <div class="counts">
            ${q.options.map((o,i)=>`
              <div class="countrow">
                <span style="width:18px;">${i===q.correct?'✅':''}</span>
                <span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; ${i===q.correct?'font-weight:700;':''}">${esc(o)}</span>
                <span class="track"><span class="fill" style="width:${((counts[i]||0)/maxCount)*100}%; background:${i===q.correct?'var(--ok)':'var(--line)'}"></span></span>
                <span class="n">${counts[i]||0}</span>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="card col" style="gap:10px;">
          <h3 style="font-size:16px;">Top puntajes</h3>
          <div class="lead">
            ${leaderboard.map((p,i)=>`<div class="leadrow"><span class="rank">${i+1}</span><span class="name">${esc(p.name)}</span><span class="score">${p.score||0}</span></div>`).join('') || '<span class="muted">Sin jugadores</span>'}
          </div>
        </div>
        <button class="btn primary block big" id="next">${isLast? 'Ver resultados finales' : 'Siguiente pregunta'}</button>
      </div>
    </div>
  `);
  document.getElementById('next').onclick = async ()=>{
    const btn = document.getElementById('next');
    btn.disabled = true;
    try{
      if(isLast){
        await mutateBlob(gameId, g=>({...g, status:'end'}), g=>g.status==='end');
      }else{
        const nextIdx = gameDoc.qIndex+1;
        await mutateBlob(gameId, g=>({...g, status:'question', qIndex:nextIdx, startedAt:Date.now()}), g=>g.status==='question' && g.qIndex===nextIdx);
      }
      pollOnce();
    }catch(e){ btn.disabled=false; }
  };
}

// ================= JOIN / PLAYER =================
function showJoin(prefillId){
  render(`
    <div class="wrap">
      ${topbar('unirme')}
      <div class="stage">
        <div class="card col" style="gap:16px;">
          <h2>Unirme a una partida</h2>
          <label class="field">Código de la partida (o pégalo si te lo pasaron por link)
            <input type="text" id="code" placeholder="Código" value="${prefillId?esc(prefillId):''}">
          </label>
          <label class="field">Tu nombre
            <input type="text" id="name" maxlength="20" placeholder="Nombre">
          </label>
          <p class="err" id="join-err"></p>
          <div class="row">
            <button class="btn ghost" id="back">Volver</button>
            <button class="btn primary block" id="go">Unirme</button>
          </div>
        </div>
      </div>
    </div>
  `);
  document.getElementById('back').onclick = showStart;
  document.getElementById('go').onclick = doJoin;
  document.getElementById('name').addEventListener('keydown', e=>{ if(e.key==='Enter') doJoin(); });
  if(prefillId) document.getElementById('name').focus();
}

async function doJoin(){
  const errEl = document.getElementById('join-err');
  errEl.textContent='';
  const code = document.getElementById('code').value.trim();
  const name = document.getElementById('name').value.trim();
  if(!code){ errEl.textContent='Escribe o pega el código de la partida.'; return; }
  if(!name){ errEl.textContent='Escribe tu nombre.'; return; }
  const goBtn = document.getElementById('go');
  goBtn.disabled = true; goBtn.textContent='Uniendo…';
  try{
    const g = await getBlob(code);
    if(!g){ errEl.textContent='No existe una partida con ese código.'; goBtn.disabled=false; goBtn.textContent='Unirme'; return; }
    if(g.status!=='lobby'){ errEl.textContent='Esa partida ya comenzó o terminó.'; goBtn.disabled=false; goBtn.textContent='Unirme'; return; }
    await mutateBlob(code,
      cur=>({...cur, players:{...(cur.players||{}), [CLIENT_ID]:{name, score:0, joinedAt:Date.now()}}}),
      cur=> !!(cur.players && cur.players[CLIENT_ID])
    );
    gameId = code; answersId = g.answersId; role='player'; myName = name; myScore = 0;
    saveSession();
    startPolling();
  }catch(e){
    errEl.textContent='No se pudo unir (falló el servicio de almacenamiento). Intenta de nuevo.';
    goBtn.disabled=false; goBtn.textContent='Unirme';
  }
}

function drawPlayerWait(){
  render(`
    <div class="wrap">
      ${topbar('sala de espera')}
      <div class="stage">
        <div class="card center col" style="gap:14px;">
          <h2>¡Estás dentro, ${esc(myName)}!</h2>
          <p class="muted">Esperando a que el anfitrión inicie la partida…</p>
        </div>
      </div>
    </div>
  `);
}

let lastQIndex = -1, lastStatus = null;
function drawPlayerQuestion(){
  if(lastQIndex!==gameDoc.qIndex || lastStatus!=='question'){ answeredThisRound=false; myLastAnswer=null; }
  lastQIndex = gameDoc.qIndex; lastStatus='question';
  const q = gameDoc.questions[gameDoc.qIndex];
  const shapes = ['o0','o1','o2','o3'];
  render(`
    <div class="wrap">
      ${topbar(`pregunta ${gameDoc.qIndex+1} / ${gameDoc.questions.length}`)}
      <div class="stage">
        <div class="card col" style="gap:14px;">
          <div class="qtext">${esc(q.question)}</div>
          <div class="timerbar"><div id="bar" style="width:100%;"></div></div>
        </div>
        <div class="opts" id="opts">
          ${q.options.map((o,i)=>`<button class="opt ${shapes[i]}" data-i="${i}" ${answeredThisRound?'disabled':''}><span class="shape"></span><span class="label">${esc(o)}</span></button>`).join('')}
        </div>
        <p class="muted center" id="status">${answeredThisRound? 'Respuesta enviada. Esperando a los demás…' : 'Toca una opción'}</p>
      </div>
    </div>
  `);
  document.querySelectorAll('#opts .opt').forEach(btn=>{
    btn.onclick = ()=> submitAnswer(parseInt(btn.dataset.i,10));
  });
  if(countdownTimer) clearInterval(countdownTimer);
  const tick = ()=>{
    const bar = document.getElementById('bar');
    if(!gameDoc || gameDoc.status!=='question'){ clearInterval(countdownTimer); return; }
    const elapsed = Date.now()-gameDoc.startedAt;
    const pct = Math.max(0, 100 - (elapsed/gameDoc.limitMs)*100);
    if(bar) bar.style.width = pct+'%';
  };
  tick();
  countdownTimer = setInterval(tick, 300);
}

async function submitAnswer(i){
  if(answeredThisRound || !gameDoc || gameDoc.status!=='question') return;
  answeredThisRound = true;
  document.querySelectorAll('#opts .opt').forEach(b=>b.disabled=true);
  const statusEl = document.getElementById('status');
  if(statusEl) statusEl.textContent = 'Enviando…';
  const q = gameDoc.questions[gameDoc.qIndex];
  const qIndex = gameDoc.qIndex;
  const elapsed = Date.now() - gameDoc.startedAt;
  const correct = i === q.correct;
  const remainFrac = Math.max(0, Math.min(1, (gameDoc.limitMs-elapsed)/gameDoc.limitMs));
  const points = correct ? Math.round(300 + 700*remainFrac) : 0;
  myLastAnswer = { optionIndex:i, correct, points };
  const key = `${qIndex}_${CLIENT_ID}`;
  try{
    await mutateBlob(answersId,
      cur=>({...cur, [key]:{clientId:CLIENT_ID, name:myName, qIndex, optionIndex:i, correct, points, answeredAt:Date.now()}}),
      cur=> !!cur[key]
    );
    // Add points to this player's own score. Re-reads the freshest document on every
    // retry and only touches our own player key, so a collision with another player's
    // concurrent write resolves itself instead of dropping either update.
    await mutateBlob(gameId,
      g=>{
        const prev = g.players[CLIENT_ID] || {name:myName, score:0};
        return {...g, players:{...g.players, [CLIENT_ID]:{...prev, score:(prev.score||0)+points, lastAnsweredQ:qIndex}}};
      },
      g=> g.players[CLIENT_ID]?.lastAnsweredQ === qIndex
    );
    if(statusEl) statusEl.textContent = 'Respuesta enviada. Esperando a los demás…';
  }catch(e){
    if(statusEl) statusEl.textContent = 'No se pudo enviar tu respuesta, revisa tu conexión.';
  }
}

function drawPlayerReveal(){
  lastStatus='reveal';
  const q = gameDoc.questions[gameDoc.qIndex];
  const shapes = ['o0','o1','o2','o3'];
  const picked = myLastAnswer ? myLastAnswer.optionIndex : null;
  render(`
    <div class="wrap">
      ${topbar(`respuesta ${gameDoc.qIndex+1} / ${gameDoc.questions.length}`)}
      <div class="stage">
        <div class="card col" style="gap:14px;">
          <div class="qtext">${esc(q.question)}</div>
        </div>
        <div class="opts">
          ${q.options.map((o,i)=>{
            let cls = shapes[i];
            if(i===q.correct) cls += ' correct';
            else if(i===picked) cls += ' wrong';
            return `<div class="opt ${cls}" style="cursor:default;"><span class="shape"></span><span class="label">${esc(o)}</span></div>`;
          }).join('')}
        </div>
        ${myLastAnswer ? `
          <div class="feedback ${myLastAnswer.correct?'ok':'no'}">
            <div class="pts">${myLastAnswer.correct? '+'+myLastAnswer.points : '0'}</div>
            <div>${myLastAnswer.correct? '¡Correcto!' : 'Incorrecto'}</div>
            <div class="muted">Puntaje total: ${myScore}</div>
          </div>
        ` : `<div class="feedback"><div class="muted">No alcanzaste a responder</div><div class="muted">Puntaje total: ${myScore}</div></div>`}
      </div>
    </div>
  `);
}

function drawPodium(isHost){
  const sorted = Object.values(gameDoc.players||{}).sort((a,b)=>(b.score||0)-(a.score||0));
  const top3 = sorted.slice(0,3);
  const rest = sorted.slice(3,10);
  const order = top3.length===3? [top3[1],top3[0],top3[2]] : top3;
  const podiumHtml = order.filter(Boolean).map(p=>{
    const rank = top3.indexOf(p)+1;
    return `<div class="pillar p${rank}"><span class="nm">${esc(p.name)}</span><div class="bar">${rank===1?'🏆':''} ${p.score||0}</div></div>`;
  }).join('');
  render(`
    <div class="wrap">
      ${topbar('resultados finales')}
      <div class="stage">
        <div class="card col center" style="gap:10px;">
          <h2>¡Partida terminada!</h2>
          <div class="podium">${podiumHtml || '<span class="muted">Sin jugadores</span>'}</div>
        </div>
        ${rest.length? `<div class="card col" style="gap:8px;">
          <h3 style="font-size:15px;">Resto de la tabla</h3>
          <div class="lead">
            ${rest.map((p,i)=>`<div class="leadrow"><span class="rank">${i+4}</span><span class="name">${esc(p.name)}</span><span class="score">${p.score||0}</span></div>`).join('')}
          </div>
        </div>`:''}
        <button class="btn block big ${isHost?'primary':''}" id="again">Volver al inicio</button>
      </div>
    </div>
  `);
  document.getElementById('again').onclick = ()=>{ clearSession(); showStart(); };
}

boot();
</script>
